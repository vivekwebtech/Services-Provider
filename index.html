<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RioGram Footer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background-color: #0f172a;
      font-family: 'Inter', sans-serif;
    }

    .footer {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 10px;
      background-color: #0f172a;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-name {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(to right, #7e63f6, #ec4d90);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sparkle-icon {
      width: 26px;
      height: 26px;
    }

    .sparkle-icon svg {
      width: 100%;
      height: 100%;
      fill: #0ea5e9; /* Tailwind sky-500 */
      transform: rotate(10deg);
    }

    @media (max-width: 480px) {
      .brand-name {
        font-size: 22px;
      }

      .sparkle-icon {
        width: 22px;
        height: 22px;
      }
    }
  </style>
</head>
<body>
  <footer class="footer">
    <div class="brand">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sparkles w-8 h-8 text-cyan-400 mr-4 animate-pulse"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path><path d="M5 3v4"></path><path d="M19 17v4"></path><path d="M3 5h4"></path><path d="M17 19h4"></path></svg><span class="text-3xl font-bold text-white gradient-text">RioGram</span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sparkles w-8 h-8 text-cyan-400 ml-4 animate-pulse"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path><path d="M5 3v4"></path><path d="M19 17v4"></path><path d="M3 5h4"></path><path d="M17 19h4"></path></svg>
    </div>
  </footer>
</body>
</html>
