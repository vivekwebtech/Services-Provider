<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Award Card</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f4ff;
    }

    .award-card {
      background: white;
      border-radius: 16px;
      padding: 24px 32px;
      width: 300px;
      box-shadow: 0 0 20px rgba(0, 119, 255, 0.3);
      text-align: left;
      animation: fadeIn 2s ease, bounce 2s infinite;
    }

    .award-card .icon {
      font-size: 28px;
      color: #f4c300;
      margin-bottom: 12px;
    }

    .award-card .number {
      font-size: 32px;
      font-weight: 700;
      color: #1e1e1e;
    }

    .award-card .label {
      font-size: 18px;
      color: #555;
      margin-bottom: 8px;
    }

    .award-card .subtext {
      font-size: 14px;
      color: #d49200;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }
  </style>
</head>

</body>
</html>
